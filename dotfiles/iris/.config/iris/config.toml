[updater]
check-on-startup = false

[keybindings]
select = "ctrl+y"
navigate-down = "ctrl+n"
navigate-up = "ctrl+p"
toggle-menu = "ctrl+space"

[ai]
enabled = false
provider = "opencode-go"
debounce_ms = 400

[ai.providers.cli-proxy-api]
inherited_from = "openai"
endpoint = "http://localhost:8317/v1"
api_key_env = "IRIS_CLI_PROXY_API_KEY"
model_env = "IRIS_CLI_PROXY_API_MODEL"
timeout_ms = 3000

[ai.providers.cli-proxy-api.extra_request_body]
reasoning_effort = "none"

[ai.providers.opencode-go]
inherited_from = "openai"
endpoint = "https://opencode.ai/zen/go/v1"
api_key_env = "IRIS_OPENCODE_GO_API_KEY"
model_env = "IRIS_OPENCODE_GO_MODEL"
timeout_ms = 3000

[ai.providers.opencode-go.extra_request_body]
reasoning_effort = "none"

[ai.providers.openrouter]
inherited_from = "openai"
endpoint = "https://openrouter.ai/api/v1"
api_key_env = "IRIS_OPENROUTER_API_KEY"
model_env = "IRIS_OPENROUTER_MODEL"
timeout_ms = 3000

[ai.providers.openrouter.extra_request_body.reasoning]
effort = "none"

[ai.providers.zai-coding-plan]
inherited_from = "openai"
endpoint = "https://api.z.ai/api/coding/paas/v4"
api_key_env = "IRIS_ZAI_CODING_PLAN_API_KEY"
model_env = "IRIS_ZAI_CODING_PLAN_MODEL"
timeout_ms = 3000

[ai.providers.zai-coding-plan.extra_request_body.thinking]
type = "disabled"
