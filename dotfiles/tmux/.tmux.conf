# General
set -g default-command "${SHELL}"
set -g default-shell "${SHELL}"
set -as terminal-overrides ",alacritty*:RGB"
set -as terminal-overrides ",alacritty*:extkeys"
set -as terminal-overrides ",screen*:RGB"
set -as terminal-overrides ",screen*:extkeys"
set -as terminal-overrides ",xterm*:RGB"
set -as terminal-overrides ",xterm*:extkeys"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -as terminal-features ",alacritty*:clipboard"
set -as terminal-features ",screen*:clipboard"
set -as terminal-features ",xterm*:clipboard"
set -as terminal-features ",xterm*:extkeys"
set -as terminal-features ',tmux*:clipboard'
set -as terminal-features ',tmux*:extkeys'
set -g set-clipboard on

set -gq allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g xterm-keys on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g focus-events on
set -g mode-keys vi
set -g mouse on

set -g set-titles on
set -g set-titles-string "[#S/#W] #T"

set -g detach-on-destroy off

# iris wraps the shell in a nested pty, so the process-based
# #{pane_current_path} stays frozen at the pane's launch directory. Prefer the
# OSC 7 path emitted by fish (#{pane_path}) when it is from this host.
# NOTE: `file...` in the regex is `file://` — a literal `:` breaks the
# s-modifier's argument parsing.
%hidden pane_cwd="#{?#{m:file://#{host_short}/*,#{pane_path}},#{s|^file...[^/]*||:pane_path},#{pane_current_path}}"

# Key Mappings
set -g prefix C-a
unbind C-b

bind-key -N "Sessions" s choose-tree -Zs -O name

bind-key -N "Kill all" Q confirm-before "kill-server"
bind-key -N "Swap Window" M swap-window
bind-key -N "Popup" P popup -x "#{popup_pane_right}" -y "#{popup_pane_bottom}" -w "40%" -h "40%" -d "$pane_cwd"

# Override pain-control's splits/new-window (loaded before this file) so they
# use $pane_cwd instead of the iris-frozen #{pane_current_path}.
bind-key "|" split-window -h -c "$pane_cwd"
bind-key "\\" split-window -fh -c "$pane_cwd"
bind-key "-" split-window -v -c "$pane_cwd"
bind-key "_" split-window -fv -c "$pane_cwd"
bind-key "%" split-window -h -c "$pane_cwd"
bind-key '"' split-window -v -c "$pane_cwd"
bind-key "c" new-window -c "$pane_cwd"

bind-key -N "Next layout" v next-layout

bind-key -N "Workmux" i display-popup -w "80%" -h "80%" -E "workmux dashboard"
bind-key -N "TmuxAI" T split-window -h -p 30 -c "$pane_cwd" "tmuxai"
bind-key -N "Sync panes" C-s setw synchronize-panes \; display-message "Sync: #{?pane_synchronized,ON,OFF}"

# Remove confirm-before
bind-key -N "Kill window" & kill-window
bind-key -N "Kill pane" x kill-pane

source-file "~/.tmux/copy-mode-vi.tmux"
